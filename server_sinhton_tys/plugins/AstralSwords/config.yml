# ============================================================================
#                      ASTRAL SWORDS - MASTER CONFIGURATION
# ============================================================================

# ============================================================================
#                           GENERAL SETTINGS
# ============================================================================
general:
  # Enable debug logging
  debug: false
  
  # Check for updates on startup
  check-updates: true

# ============================================================================
#                           PROTECTION SETTINGS
# ============================================================================
protection:
  # Prevent storing astral swords in containers (chests, barrels, etc.)
  # When false: Swords can only be placed in anvils
  # When true: Swords can be placed in any container
  allow-container-storage: false
  
  # Allow placing astral swords in item frames
  # When false: Players cannot place swords in item frames
  # When true: Players can place swords in item frames
  allow-item-frames: false
  
  # Allow hoppers to pick up astral swords
  # When false: Hoppers cannot pick up swords from the ground
  # When true: Hoppers can pick up swords
  allow-hopper-pickup: false
  
  # Allow swords to be renamed in anvils
  # When false: Players cannot rename swords in anvils
  # When true: Players can rename swords in anvils
  allow-anvil-renaming: false
  
  # Allow swords to be enchanted in anvils using enchantment books
  # When false: Players cannot add enchantments to swords in anvils
  # When true: Players can add enchantments to swords in anvils
  allow-anvil-enchanting: false

# ============================================================================
#                           ABILITY SETTINGS
# ============================================================================
abilities:
  skyfall-blade:
    cooldown-seconds: 30
    launch-power: 2.5
    ground-explosion:
      radius: 8.0
      damage: 15.0
      power: 2.0
      create-fire: true
      break-blocks: true
    airborne-explosion:
      base-radius: 8.0
      base-damage: 15.0
      velocity-damage-factor: 0.5
      max-velocity-multiplier: 3.0
      base-power: 2.0
      max-power: 4.0
      create-fire: true
      break-blocks: true

  eclipse-blade:
    lunar-edge:
      max-light-level: 7
      damage-multiplier: 1.2

  soul-reaver:
    soul-harvest:
      cooldown-seconds: 30
      radius: 6.0
      damage: 6.0
      heal-ratio: 0.5
      max-heal: 10.0

  wardens-oath:
    echo-sense:
      radius: 16.0
      glow-duration-ticks: 30
      refresh-ticks: 20

  power-house:
    smash:
      minimum-fall-distance: 1.5
      damage-per-block: 1.0
      max-bonus-damage: 10.0

# ============================================================================
#                           SWORD ENCHANTMENTS
# ============================================================================
# Configure enchantments for each celestial sword
# Format: enchantment_name: level
sword-enchants:
  skyfall_blade:
    sharpness: 8
    unbreaking: 4
  
  thunderstrike:
    sharpness: 8
    unbreaking: 4
  
  venom_edge:
    sharpness: 8
    unbreaking: 4
    sweeping_edge: 5
  
  eclipse_blade:
    sharpness: 8
    unbreaking: 4
  
  soul_reaver:
    sharpness: 8
    unbreaking: 4
  
  phoenix_talon:
    sharpness: 8
    unbreaking: 4
    fire_aspect: 5
  
  wardens_oath:
    sharpness: 8
    unbreaking: 4
  
  windblade:
    sharpness: 8
    unbreaking: 4
  
  power_house:
    sharpness: 8
    unbreaking: 4
    knockback: 3
    wind_burst: 1

