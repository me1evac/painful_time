# Whether the EliteMobs economy is enabled (elite coins, shops, guild ranks).
# If disabled, players will not be able to progress in the plugin!
enableEconomy: true
# Percentage of the original price players get when reselling items. 5 = 5%.
itemResaleValue: 5.0
# Whether to use Vault for the economy instead of the built-in system.
# NOT RECOMMENDED! See: https://wiki.nightbreak.io/EliteMobs/vault
useVault: false
# Whether elites drop currency (coins) on death.
enableCurrencyShower: true
# Multiplier for currency dropped by elites. 1.0 = normal, 2.0 = double drops.
currencyShowerTierMultiplier: 1.0
lootShowerDataV2:
  '1': elitemobs:coins/coin1
  '5': elitemobs:coins/coin1
  '10': elitemobs:coins/coin2
  '20': elitemobs:coins/coin3
  '50': elitemobs:coins/coin4
  '100': elitemobs:coins/coin4
  '500': elitemobs:coins/coin4
  '1000': elitemobs:coins/coin4
# Tax rate (0.0-1.0) on player-to-player currency transfers. 0.2 = 20% tax.
# Recommended to prevent high-level players from funneling currency through alts to avoid taxes.
playerToPlayerPaymentTaxes: 0.2
lootShowerMaterial:
  # Material used for dropped coins worth 1 currency.
  '1': GOLD_NUGGET
  '5': GOLD_INGOT
  '10': GOLD_BLOCK
  '20': EMERALD
  '50': EMERALD_BLOCK
  '100': DIAMOND
  '500': DIAMOND_BLOCK
  '1000': NETHER_STAR
lootShowerData:
  # Custom model data ID for dropped coins worth 1 currency. Used by the resource pack.
  '1': 1
