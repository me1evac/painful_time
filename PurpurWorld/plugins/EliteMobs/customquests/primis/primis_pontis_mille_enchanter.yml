- "&a[Fortes]&f Do not forget! Drag over you gear, the enchantment book and any lucky tickets you might have into the enchantment window and then click on Enchant when you are ready!"
- "&7&oI should find &a&oMeliorem the Enchanter&7&o and upgrade some of my gear."
