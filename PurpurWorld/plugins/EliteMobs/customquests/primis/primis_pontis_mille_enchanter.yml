name: '&2Enchanted!'
questLore:
- "Hmm, your gear could use some upgrades."
- "We have an enchanter in our city that could help you out with that."
- "You see enchanting is a pretty straight forward process."
- "All you need is some &eElite Gear&f and an &eEnchantment Book&f and if you have it with you, an optional &eLucky Ticket&f."
- "You talk to the &aEnchanter&f and a window will open up where you can drag over your piece of &eElite Gear&f your &eEnchantment Book&f and any &eLucky Tickets&f you might have."
- "The &eLucky Tickets&f are completely optional, they only improve the chance of the enchantment being a success."
- "After you have placed your items in the correct slots you can hit the Enchant button and hopefully you will have an enchanted piece of gear!"
- "Oh, and of course the enchanter will charge you a small fee for their service."
