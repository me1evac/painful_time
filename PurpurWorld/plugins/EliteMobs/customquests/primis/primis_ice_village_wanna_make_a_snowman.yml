- The kids around the village have been pretty bored lately and I've been thinking.
- There are these &cMagical Creatures&f that inhabit the woods around this village.
- The creatures fur grows &eMagical Ice Crystals&e.
- When you infuse snow with these &eCrystals&f it makes the snow shuffle around and expand and contract.
- And if you build a snowman out of this infused snow it makes it look as if the snowman is moving.
- The kids would love it! So, want to help this old man cheer up some kids?
