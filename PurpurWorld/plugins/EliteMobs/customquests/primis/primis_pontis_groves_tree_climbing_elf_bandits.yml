questLore:
- I've had it up here with these gosh darn tree climbing &cElf Bandits&f in our &dGrove&f.
- Not like the &cSpiders&f were enough, now these shadow loving poop nuts have decided to settle in our trees!
- They love the dark you see, the light hurts them, makes them all foggy in the head.
- Of course a lot of darkness and shadow in our little &dGrove&f. So they moved right
  in!
- Forced their way in with their superior numbers.
- Well they got something coming alright, one look at you and I can tell you can handle a couple of stone giants!
- I am sure some elves won't be much of an issue for you.
- Go send them a message. The message is clear, THEIR NASTY BUTTS AIN'T WELCOME HERE!
