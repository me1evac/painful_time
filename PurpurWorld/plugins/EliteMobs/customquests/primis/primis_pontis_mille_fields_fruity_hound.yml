name: '&2Fruity hound'
questLore:
- Since you are my NUMBER ONE berry recovery agent, I have another task for you.
- As you can see we grow some very large berries on our little &dBerry Farm&f here.
- There was a &eSpecific Berry&f I was growing for a contest.
- But as I was walking to the &dBerry Farm&f I saw a &cFruity Rockhound&f jump for the bush holding my prized berry.
- He snapped it off and carried it away.
- Its jaws were holding the berry by its stem so it should still be in one piece, I hope.
- If you go slay the beast and bring back my dear &eContest Berry&f I will have a nice reward waiting for you.
