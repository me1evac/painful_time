name: '&5Leap of faith'
questLore:
- I am not going to sugarcoat it, things look downright grim!
- The walls have fallen, the streets are teeming with the &cUndead&f and I just ran out of drinks.
- At times like these, people turn their hope to some kind of divine intervention!
- There is a &dPath&f, lit by candles, that leads to a &dSanctuary in the Mountains&f.
- Warriors go up this path and defeat the &cMonk&f which guards the sanctuary in order to be blessed by the war god in combat.
- It may just be a superstition, but would it hurt to give people hope?
- The fact you made your way here shows you are a cut above the rest - go up the mountain and defeat the &cMonk&f.
- All warriors will feel better knowing they are being watched over.
