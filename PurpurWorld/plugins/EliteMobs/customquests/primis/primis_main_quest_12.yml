questLore:
- I cannot believe what befell &dGladius&f. They hit it fast, and they hit it where it hurts most.
- It is our sworn duty to aid our allies. We have failed our duty, and we have failed our allies.
- The &cCounselor's&f ordered us to mobilize our troops in several zones before the invasion.
- You see, recently and unusual and devastating storm was spotted at the &dStorm Temple&f.
- The Royal Guard was ordered to quiet the storm, and the &aShogun&f refuses to belay that order.
- Our own guards are in other places, and I fear we will need all that we have to take &dGladius&f back.
- The path to the &dStorm Temple&f is treacherous, as it requires going through the &dGoblin Mines&f.
- Help our guard clear the mines and make a path to the &dStorm Temple&f!
