name: '&2The trial of ice'
questLore:
- Well you have certainly impressed me and most of the village.
- I owe you an explanation friend. You see for the longest time we used to draw power
  from the &cIce Elementals&f.
- They would bless us with their power and in return any of us who would want to become
  a warrior or a hunter had to pass the &9Trial of Ice&f.
- To pass the trial you had to climb the black mountain all the way to its eastern
  peak. And at the peak you would face the &cMinor Ice Elementals&f in combat.
- Should you succeed then your claim to become a warrior or a hunter was unquestionably
  your right.
- If you failed...then...your energy and your being belonged to the &cIce Elementals&f.
- This is how it was for the longest time. Until the &dBlood Temples&f influence grew
  in power.
- Ever since then the &cIce Elementals&f have been emboldened. Drawing power from them was now a risk.
- Several of our people got corrupted and we had to jail them for our own safety.
- And doing the trial became impossible, what faced you at the peak was something
  no villager could overcome.
- Those who have failed the trial are still there, their souls trapped in the husks
  of their decaying bodies.
- Slaves to the &cIce Elementals&f.
- It is clear that our old traditions are no longer.
- The &cIce Elementals&f must be dealt with...
- I would ask you to be the last one to undertake &9The Trial of Ice&f. Climb to the peak and face the &cMinor Ice Elementals&f and release the souls of those who failed the trial.
