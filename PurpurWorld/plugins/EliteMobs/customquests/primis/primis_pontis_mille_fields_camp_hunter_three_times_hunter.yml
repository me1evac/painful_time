name: '&2Hunter three times hunter'
questLore:
- So you found &aVolumnia&f. Thank the great hunters that she is alright.
- Since you have helped &aVolumnia&f and proven yourself a kind soul.
- How about a friendly challenge. I would be willing to offer you some nice quality armor should you face the challenge and return victorious.
- The challenge involves hunting &cThree Great Beasts&f scattered across Pontis.
- The &cBeast Cod Furiosa&f who swims underneath a bridge where two mountains stand.
- &cBeast Crawler Megdun&f that slumbers on top of a sun covered grove.
- Dancing between two western peaks you will find the &cBeast Impaler Uladzimir.
- As proof bring me the &eImpaler's Horn&f, the &eCod's Scale&f and the &eCrawler's Silk&f.
