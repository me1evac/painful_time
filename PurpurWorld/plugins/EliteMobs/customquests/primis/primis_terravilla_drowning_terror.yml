name: '&2Drowning terror'
questLore:
- My theory was correct. I dissected the growth and found an organism inside.
- After careful examination I have determined that the organism is of aquatic origin.
- And not only that, they are capable of hijacking the host's brain.
- Once ready to hatch they make the host go to the nearest water source and drown themselves.
- The organism can then freely hatch and swim away.
- Whatever is infecting the &cTwo Legged Terrors&f must be living in a nearby river.
- You should go there and collect a &ePerfect Sample&f of whatever organism is causing this.
- I do not know if this is something that can affect humans, but just in case you should kill a few of the organisms to make sure that their numbers stay low.
