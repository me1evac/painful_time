questCompleteMessage:
- '&a[Plautia Suilius]&f Wow it looks like a fish, but it''s internal organs are different.'
- It must infect other creatures by releasing these tiny worm like meat particles...
- Let me have a look at you. Hmm, you seem fine, no traces...
- So it is not affecting us...yet. This is an emergency, I need to collect my stuff
  and go present my findings to the researchers at &dPontis Mille&f immediately. I
  need to get approval for extermination, that organism cannot be allowed to evolve.
- Thank you for everything you have done. Here, take this. It's not a lot but at least
  it's something.
- '&7&oI should make sure to stay away from the river...'
