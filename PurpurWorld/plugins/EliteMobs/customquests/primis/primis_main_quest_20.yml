name: '&2Terravilla'
questLore:
- Some time ago we received a request for aid from a nearby settlement.
- Years ago a bunch of explorers settled on top of this ancient ruin.
- I think they call their little settlement &dTerravilla&f.
- Apparently there is a lot of treasure to be had there if you don't mind the risk of death.
- But I hear that something has gone wrong there and they asked us if we could spare any help to send their way.
- To be honest, you are the strongest warrior I have ever seen.
- You are the best help we could send. If you would like to, of course.
