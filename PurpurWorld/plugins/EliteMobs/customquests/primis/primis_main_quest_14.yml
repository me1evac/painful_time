name: '&2Storm''s end'
questLore:
- It is hard to believe that you pushed through the &dGoblin Mines&f on your own.
- Perhaps with your fortitude you will be able to face the challenge ahead.
- We attempted to assault the &dStorm Temple&f, and reached its deepest confines at a great cost.
- What we found there... It defies understanding.
- It may be hard to believe, but it sounds like the very storm itself has materialized as our opponent.
- We do not even know if it can be defeated. We feared we were sent to our deaths.
- If you truly defeated the &cGoblin King&f, then perhaps you will find a way to slay
  this storm.
