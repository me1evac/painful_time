- The Storm is no ordinary opponent. Do not underestimate it.
- '&7&oI should go into the &dStorm Temple&f and slay the &cStorm&f.'
questCompleteMessage:
- '&a[Shogun Navita]&f You WHAT!?'
- Defeated the &cStorm&f? I was told that was impossible! I mean...
- '... it is no use hiding it now. I knew about the &cStorm&f. I knew about the &dGladius&f
  invasion - I even facilitated it. I did it for my people - for &dPontis Mille&f.'
- '&cCounselor Machiavelli&f convinced me that the &cStorm&f was as unstoppable as
  Nature itself, and that the fall of &dGladius&f and &dPontis Mille&f was an inevitability
  that we could but delay through sacrifice.'
- I see now that that snake poisoned my mind and corrupted my judgment. He must be
  dealt with posthaste.
- '&8&oSeems like &aShogun Navita&7&o has a problem he wants me to deal with.'
