questLore:
- A nearby &dBandit Camp&f has recently been sighted and is trying to take us under!
- They keep raiding our supplies and kidnapping our villagers!
- They even took my &eGrandfather's Heirloom&f!
- We don't know what they want, but we need them gone!
- Figure out what they are doing, deal with them and bring me back my &eGrandfather's Heirloom&f!
