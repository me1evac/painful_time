name: '&2Strike the earth'
questLore:
- You see the real reason we asked for help is because of what happened at the ruins.
- There were always dangerous things down there, but nothing a seasoned adventurer or explorer could not handle.
- But then something awakened, these ancient constructs started rising out of the ground and the walls.
- Then these quakes started happening, it was weird, because you could only feel them if you were down in the ruins.
- So we shut everything down, nobody was allowed access to the ruins anymore.
- A few days ago I gathered some of my best men and sent them down there to find the source of it all.
- They barely made it back. They found an &cEarth Elemental&f high above the pillars, on top some sort of platform.
- It must have been there for ages, dormant.
- No clue why it decided to wake up now...
- Your job would be to go down there, navigate through the maze and put the &cEarth Elemental&f into a slumber it will never wake up from!
