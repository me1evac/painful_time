name: '&2The Battle for Gladius'
questLore:
- I assume everything has been revealed to you now?
- Good, good. While you were gonna we have finished preparing our troops.
- We are now ready to march on &dGladius &fand retake the city.
- It has pained me greatly to just standby and watch our ally suffer under siege.
- But no more! After today &dGladius &fwill be free once again!
- When you are ready to march with us go talk to the &aPontis Soldier&f.
- You can find them near the &dGladius-Pontis gate&f.
