- '&a[Fortes Bellator]&f We managed to find some &9important information&f on one of the enemy generals!'
- '&a[Fortes Bellator]&f Apparently there is a secret passage that leads to the &dBlood Temple&f somewhere in the &dFields-Ice Village Mountains&f. The entrance is sealed off by a puzzle. The solution to the puzzle was written as: &oRed, Blue, Green, Orange. If color one cannot see, then deciphering of the names one should seek.&f We are not sure what it means, hopefully it will be of use to you. Until we meet again friend!'
- '&7&oI should try and solve the puzzle to get access to the hidden passage.'
