questLore:
- We have figured out that the way to the core of the temple is blocked by &9four barriers&f.
- The &9barriers&f seem to be magically held in place by &cFour Guardians&f.
- Killing them should dispel the &9barriers&f.
- Our scouts report that the &cFour Guardians&f are. A &cGiant&f at the bottom of the temple. An &cAlchemist&f at the southern side of the temple. A &cCultist&f mage at the northern side of the temple. And finally some sort of &cObserver&f construct at the north-eastern side of the temple.
