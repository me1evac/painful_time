name: '&2Serious sewage'
questLore:
- If you are up to the task then I could use your help.
- The &dSewers&f under the city have become a lair for all sorts of trouble makers and critters.
- The trouble makers call themselves &cNinjas&f...even though they are far from it.
- They have a leader, I think he calls himself &cShreepper&f or something.
- Make sure to get rid of him, a snake without it's head is not a threat.
- If you could go down there and thin the numbers of critters and the trouble makers then that would allow me to assign my forces to more important tasks...
- We had also sent &a4 Agents&f down there, I have not heard from them yet.
- It would mean a lot to me if you could check up on them to make sure they are OK.
- I also seem to have misplaced my personal &eSewage Keys&f if you could retrieve those too, then that would be great.
temporaryPermissions:
- elitequest.primis_pontis_mille_sewage_keys.yml
questAcceptDialog:
- '&a[Rogerius]&fYou can get to the &dSewers&f by going to the fountain and then a
  bit south-east.'
- You know you are at the right spot when you see a big sewage pipe going into the
  wall.
- '&7&oI need to find my way into the &dSewers&7&o and complete the tasks.'
questCompleteMessage:
- '&a[Rogerius]&f You have completed the all I have asked? If only I had 10 more men
  like you...'
questCompleteCommands: []
