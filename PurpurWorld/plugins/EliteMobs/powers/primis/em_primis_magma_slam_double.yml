      - FlameSlamAttack8
    - action: RUN_SCRIPT
      wait: 50
      scripts:
      - FlameSlamAttackDamage7
      - FlameSlamAttackDamage8
      - FlameSlamAttack2Damage7
      - FlameSlamAttack2Damage8
  Teleport:
    Actions:
    - action: TELEPORT
      Target:
        targetType: SELF
      FinalTarget:
        targetType: SELF_SPAWN
  MobAi:
    Actions:
    - action: SET_MOB_AI
      Target:
        targetType: SELF
      bValue: false
      duration: 80
  FlameSlamAttackStartup1:
    Zone:
      Shape: ROTATING_RAY
      filter: PLAYER
      animationDuration: 20
      pitchPreRotation: -55
      pitchRotation: 10
      ignoresSolidBlocks: true
      pointRadius: .5
      Target:
        targetType: SELF_SPAWN
        track: false
      Target2:
        targetType: SELF_SPAWN
        offset: 14,0,0
        track: false
    Actions:
    - action: SPAWN_PARTICLE
      repeatEvery: 2
      times: 10
      Target:
        targetType: ZONE_FULL
        track: false
      particles:
      - particle: FLAME
        amount: 1
        x: .1
        y: .1
        z: .1
        speed: 0
