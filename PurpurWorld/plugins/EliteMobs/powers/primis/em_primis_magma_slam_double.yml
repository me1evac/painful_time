isEnabled: true
powerType: UNIQUE
eliteScript:
  ScriptRunnerRepeat:
    Events:
    - EliteMobDamagedEvent
    Actions:
    - action: RUN_SCRIPT
      scripts:
      - ScriptRunnerSet1
      - ScriptRunnerSet2
      - ScriptRunnerSet3
      - ScriptRunnerSet4
      onlyRunOneScript: true
    Cooldowns:
      local: 600
      global: 60
  ScriptRunnerSet1:
    Actions:
    - action: RUN_SCRIPT
      scripts:
      - Teleport
      - MobAi
      - FlameSlamAttackStartup1
      - FlameSlamAttackStartup2
    - action: RUN_SCRIPT
      wait: 20
      scripts:
      - FlameSlamAttack1
      - FlameSlamAttack2
    - action: RUN_SCRIPT
      wait: 50
      scripts:
      - FlameSlamAttackDamage1
      - FlameSlamAttackDamage2
  ScriptRunnerSet2:
    Actions:
    - action: RUN_SCRIPT
      scripts:
      - Teleport
      - MobAi
      - FlameSlamAttackStartup3
      - FlameSlamAttackStartup4
    - action: RUN_SCRIPT
      wait: 20
      scripts:
      - FlameSlamAttack3
      - FlameSlamAttack4
    - action: RUN_SCRIPT
      wait: 50
      scripts:
      - FlameSlamAttackDamage3
      - FlameSlamAttackDamage4
  ScriptRunnerSet3:
    Actions:
    - action: RUN_SCRIPT
      scripts:
      - Teleport
