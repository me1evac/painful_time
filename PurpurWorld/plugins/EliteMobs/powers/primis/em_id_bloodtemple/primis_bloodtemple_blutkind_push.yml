powerType: UNIQUE
eliteScript:
  Trigger:
    Events:
    - EliteMobDamagedByPlayerEvent
    Actions:
    - action: RUN_SCRIPT
      wait: 5
      scripts:
      - "PushBarrier1"
      - "PushBarrier2"
      - "PushBarrier3"
      onlyRunOneScript: true
    Cooldowns:
      local: 400
      global: 20
  PushBarrier1:
    Zone:
      shape: DOME
      radius: 3
      borderRadius: 2
      Target:
        targetType: SELF
    Actions:
    - action: SPAWN_PARTICLE
      particles:
      - particle: EXPLOSION_NORMAL
      Target:
        targetType: ZONE_BORDER
        coverage: 0.5
      repeatEvery: 10
      times: 20
    - action: PUSH
      Target:
        targetType: ZONE_FULL
      RelativeVector:
        SourceTarget:
          targetType: SELF
        DestinationTarget:
          targetType: ACTION_TARGET
        normalize: true
        multiplier: 1.5
        offset: 0,0.5,0
      repeatEvery: 5
      times: 40
