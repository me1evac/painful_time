powerType: UNIQUE
eliteScript:
  Trigger:
    Events:
    - EliteMobDamagedEvent
    - PlayerDamagedByEliteMobEvent
    - EliteMobTargetPlayerEvent
    Actions:
    - action: TITLE_MESSAGE
      Target: 
        targetType: NEARBY_PLAYERS
        range: 100
      subtitle: "&eFlame Pillar Warning"
      duration: 30
      fadeIn: 5
      fadeOut: 5
    - action: RUN_SCRIPT
      wait: 40
      scripts:
      - "FlamePullV"
      - "FlamePull"
    Cooldowns:
      local: 500
      global: 130
  FlamePullV:
    Zone:
      shape: CYLINDER
      radius: 5
      borderRadius: 4
      height: 15
      Target:
        targetType: NEARBY_PLAYERS
        range: 100
        track: false
        # RelativeOffset:
          # SourceTarget:
            # targetType: ACTION_TARGET
          # DestinationTarget:
            # targetType: SELF
          # normalize: true
          # multiplier: 0.5
          # offset: 0,0,0
    Actions:
    - action: SPAWN_PARTICLE
      particles:
      - particle: SMOKE_LARGE
        x: 5
        y: 50
        amount: 0
      Target:
        targetType: ZONE_BORDER
        coverage: 0.5
        offset: 0,-1,0
        track: false
      repeatEvery: 5
      times: 7
    - action: SPAWN_PARTICLE
      particles:
      - particle: FLAME
        x: 5
        y: 50
        amount: 0
      Target:
        targetType: ZONE_BORDER
        coverage: 0.5
        offset: 0,-1,0
        track: false
      wait: 35
      repeatEvery: 5
      times: 16
  FlamePull:
    Zone:
      shape: CYLINDER
      radius: 4
      height: 10
      Target:
        targetType: NEARBY_PLAYERS
        range: 100
        track: false
        RelativeOffset:
          SourceTarget:
            targetType: ACTION_TARGET
          DestinationTarget:
            targetType: SELF
          # normalize: true
          multiplier: 0.5
          offset: 0,0,0
    Actions:
    - action: SET_ON_FIRE
      duration: 100
      Target:
        track: false
        targetType: ZONE_FULL
      wait: 35
      repeatEvery: 10
      times: 8
    - action: PUSH
      wait: 35
      Target:
        targetType: ZONE_FULL
        track: false
      RelativeVector:
        SourceTarget:
          targetType: ACTION_TARGET
        DestinationTarget:
          targetType: ZONE_FULL
        normalize: true
        multiplier: 1.5
        offset: 0,0,0
      repeatEvery: 20
      times: 4
