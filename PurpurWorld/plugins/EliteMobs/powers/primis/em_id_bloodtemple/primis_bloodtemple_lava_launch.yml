        targetType: ZONE_FULL
      sValue: ARROW
      wait: 10
      repeatEvery: 20
      times: 8
      RelativeVector:
        SourceTarget:
          targetType: SELF
          offset: 0,0,0
        DestinationTarget:
          targetType: NEARBY_PLAYERS
          range: 40
        normalize: true
