  SpawnClearEgg1:
    Zone:
      shape: DOME
      radius: 2
      borderRadius: 1
      Target:
        targetType: SELF
    Actions:
    - action: PLAY_SOUND
      wait: 5
      sValue: "entity.generic.extinguish_fire"
      Target:
        targetType: SELF
    - action: SPAWN_PARTICLE
      particles:
      - particle: CRIMSON_SPORE
      Target:
        targetType: ZONE_BORDER
        coverage: 0.5
      repeatEvery: 5
      times: 4
    - action: PLACE_BLOCK
      material: AIR
      Target:
        targetType: ZONE_BORDER
    - action: POTION_EFFECT
      potionEffectType: WITHER
      amplifier: 1
      duration: 40
      Target:
        targetType: ZONE_BORDER
      repeatEvery: 5
      times: 4
