powerType: UNIQUE
eliteScript:
  Trigger:
    Events:
    - EliteMobSpawnEvent
    Actions:
    - action: RUN_SCRIPT
      wait: 40
      scripts:
      - "SpawnClearEgg1"
    - action: RUN_SCRIPT
      wait: 60
      scripts:
      - "SpawnClearEgg2"
    - action: RUN_SCRIPT
