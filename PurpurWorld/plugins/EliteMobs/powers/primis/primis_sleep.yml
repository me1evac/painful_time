powerType: UNIQUE
eliteScript:
  Sleep:
    Events:
    - EliteMobSpawnEvent
    - EliteMobHealEvent
    Actions:
    - action: SET_MOB_AI
      bValue: false
      Target:
        targetType: SELF
  WakeUp:
    Events:
    - EliteMobDamagedEvent
    Actions:
    - action: SET_MOB_AI
      bValue: true
      Target:
        targetType: SELF        
  Reset:
    Events:
    - EliteMobHealEvent
    Actions:
    - action: TELEPORT
      FinalTarget:
        targetType: SELF_SPAWN
      Target:
        targetType: SELF