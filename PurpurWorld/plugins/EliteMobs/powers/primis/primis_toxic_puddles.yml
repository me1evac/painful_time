  ToxicPuddlesVisual:
    Zone:
      shape: CYLINDER
      radius: 6
      height: 1
      Target:
        targetType: NEARBY_PLAYERS
        range: 30
    Actions:
    - action: PLAY_SOUND
      sValue: "entity.lingering_potion.throw"
      Target:
        targetType: SELF
    - action: PLAY_SOUND
      sValue: "entity.splash_potion.break"
      Target:
        targetType: NEARBY_PLAYERS
        track: false
        range: 20
      wait: 20
    - action: SPAWN_PARTICLE
      particles:
      - particle: SMOKE_NORMAL
      - particle: SMOKE_LARGE
      Target:
        track: false
        targetType: ZONE_FULL
        coverage: 0.5
      wait: 20
      repeatEvery: 10
      times: 4
    - action: SPAWN_PARTICLE
      particles:
      - particle: SLIME
        amount: 1
        x: 0
        y: 0.5
        z: 0
      - particle: SMOKE_NORMAL  
      Target:
        track: false
        targetType: ZONE_FULL
        coverage: 0.65
      wait: 60
      repeatEvery: 20
      times: 12000
      Conditions:
        Target:
          targetType: SELF
        conditionType: BLOCKING
        isAlive: true
        hasTags:
        - "p2"
