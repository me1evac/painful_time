        targetType: ZONE_FULL
        track: true
      RelativeVector:
        SourceTarget:
          targetType: ACTION_TARGET
          track: true
        DestinationTarget:
          targetType: SELF_SPAWN
          offset: 0,17,0
        # normalize: true
        # multiplier: 0.02
      repeatEvery: 1
      times: 120
      bValue: true
    - action: POTION_EFFECT
      duration: 10
      potionEffectType: LEVITATION
      amplifier: 1
      Target:
        targetType: ZONE_FULL
      repeatEvery: 5
      times: 24