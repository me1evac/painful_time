isEnabled: true
powerType: UNIQUE
eliteScript:
  ScriptRunnerRepeat:
    Cooldowns:
      local: 300
      global: 60
    Events:
    - EliteMobDamagedByPlayerEvent
    Actions:
    - action: RUN_SCRIPT
      wait: 10
      scripts:
      - BuffPlayer
      - TornadoZone1
      - TornadoZone2
      - TornadoZone3
      - TornadoZone4
      - TornadoWarn1
    - action: RUN_SCRIPT
      wait: 30
      scripts:
      - TornadoPull1
  BuffPlayer:
    Actions:
    - action: POTION_EFFECT
      wait: 90
      potionEffectType: SLOW_FALLING
      amplifier: 0
      duration: 100
      Target:
        targetType: NEARBY_PLAYERS
        range: 15
  TornadoZone1:
    Zone:
      Shape: ROTATING_RAY
      animationDuration: 120
      Target:
        targetType: SELF_SPAWN
        offset: 0,0,0
      Target2:
        targetType: SELF_SPAWN
        offset: 3,10,0
      yawRotation: 1080
    Actions:
    - action: SPAWN_PARTICLE
      repeatEvery: 2
      times: 60
      Target:
        targetType: ZONE_FULL
        track: false
        coverage: 0.15
      particles:
      - particle: CLOUD
        amount: 1
        x: 0.4
        y: 0.4
        z: 0.4
        speed: 0.01
  TornadoZone2:
    Zone:
      Shape: ROTATING_RAY
      animationDuration: 120
      Target:
        targetType: SELF_SPAWN
        offset: 0,0,0
      Target2:
        targetType: SELF_SPAWN
        offset: -3,10,0
      yawRotation: 1080
    Actions:
    - action: SPAWN_PARTICLE
      repeatEvery: 2
      times: 60
      Target:
        targetType: ZONE_FULL
        track: false
        coverage: 0.15
      particles:
      - particle: CLOUD
        amount: 1
        x: 0.4
