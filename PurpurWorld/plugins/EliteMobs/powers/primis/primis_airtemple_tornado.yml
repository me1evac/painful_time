  TornadoWarn1:
    Zone:
      Shape: CYLINDER
      target:
        targetType: SELF_SPAWN
        track: true
        offset: 0,-1,0
      filter: PLAYER
      radius: 5
      height: 2
    Actions:
    - action: SPAWN_PARTICLE
      repeatEvery: 2
      times: 60
      Target:
        targetType: ZONE_FULL
        track: false
        coverage: 0.3
      particles:
      - particle: FLAME
        RelativeVector:
          SourceTarget:
            targetType: ACTION_TARGET
            track: true
          DestinationTarget:
            targetType: SELF_SPAWN
            offset: 0,0,0
        # normalize: true
        # multiplier: 0.02
        speed: 0.02
