isEnabled: true
powerType: UNIQUE
eliteScript:
  ScriptRunnerRepeat:
    Cooldowns:
      local: 300
      global: 60
    Events:
    - EliteMobDamagedByPlayerEvent
    Actions:
    - action: RUN_SCRIPT
      wait: 5
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 10
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 15
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 20
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 25
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 30
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 35
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 40
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 45
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 50
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 55
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 60
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 65
      scripts:
      - TranslatingRay1
    - action: RUN_SCRIPT
      wait: 70
      scripts:
