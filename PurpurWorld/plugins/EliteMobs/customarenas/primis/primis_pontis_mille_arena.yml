arenaMessages:
- wave=1:message=&8[Star Gazer] &fIn the beginning the Elementals were just Primal wisps, nothing more than a collection of violent energy given form.
- wave=2:message=&8[Star Gazer] &fAs the wisps grew their energies took on the Primal forms of Earth, Water, Fire and Air. 
- wave=3:message=&8[Star Gazer] &fThis is when Humans appeared. At first there was harmony, but that was short-lived.
- wave=4:message=&8[Star Gazer] &fDissent grew between primal forces and humans, resulting in the formation of factions and, eventually, wars.
- wave=5:message=&8[Star Gazer] &fAs great wars waged, warfare evolved. The Primals developed into the elements as we know them today, and the humans adapted to these elements.
- wave=6:message=&8[Star Gazer] &fAs a stalemate slowly made itself evident, the conflicts between the elements and the humans came to a fragile armistice.
- wave=7:message=&8[Star Gazer] &fIn the dark, and slowly fading from Human memory, the elementals developed dark rituals through which the power of Life itself could be harnessed.
- wave=8:message=&8[Star Gazer] &fArmed with this new terrible power, the Elementals started recruiting in the shadows, taking those with a thirst for power to their side. 
- wave=9:message=&8[Star Gazer] &fThose who chose to follow the Elementals were rewarded with terrible power should they succeed, and with a fate worse than death when they failed.
- wave=10:message=&8[Star Gazer] &fEmboldened by this, Elementals have now resumed the long-forgotten war, certain that this time they will overcome Humanity.
cylindricalArena: true
