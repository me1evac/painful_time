eliteScript:
  Wait:
    Events:
    - EliteMobSpawnEvent
    Actions:
    - action: SET_MOB_AI
      bValue: false
      repeatEvery: 3
      Conditions:
        hasTags:
        - wait
      Target:
        targetType: SELF
    - action: SET_MOB_AI
      bValue: true
      repeatEvery: 20
      Conditions:
        hasTags:
        - wait
      Target:
        targetType: SELF
    - action: TAG
      tags:
      - wait
      Target:
        targetType: SELF
  SummonAssassins:
    Events:
    - EliteMobEnterCombatEvent
    Actions:
    - action: UNTAG
      tags:
      - wait
      Target:
        targetType: SELF
    - action: SET_MOB_AI
      bValue: true
      Target:
        targetType: SELF
    - action: MESSAGE
      wait: 15
      times: 1
      sValue: '&a[Invading General] &fAssassins! TO ME!'
      Target:
        range: 30.0
        targetType: NEARBY_PLAYERS
    - action: RUN_SCRIPT
      scripts:
      - SummonAssasin1
      - SummonAssasin2
      - SummonAssasin3
      - SummonAssasin4
  SummonAssasin1:
    Zone:
      radius: 1.0
      shape: CYLINDER
      height: 1
      Target:
        targetType: LOCATION
        location: same_as_boss,22,77,-94,0.0,0.0
    Actions:
    - action: SUMMON_REINFORCEMENT
      wait: 20
      times: 1
      Conditions:
        isAlive: true
      sValue: primis_gladius_assassin_summon_id.yml
      Target:
        targetType: ZONE_FULL
    - action: SPAWN_PARTICLE
      wait: 15
      Target:
        targetType: ZONE_FULL 
